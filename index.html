<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nemblo</title>
  
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap" rel="stylesheet">

  <style>
    /* CSS Variables */
    :root {
      --bg-dark: #1a0508;
      --card-bg: #270a0f;
      --gold: #c9a13a;
      --gold-light: #f7f0df;
      --ivory-2: #f7f0df;
      --line-gold: rgba(201, 161, 58, 0.3);
      --line: rgba(247, 240, 223, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--ivory-2);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      border-bottom: 1px solid var(--line);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-size: 1.2rem;
      background: rgba(201, 161, 58, 0.1);
    }

    .logo-text {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--ivory-2);
      font-family: serif;
    }

    /* Buttons */
    .btn-gold {
      background: var(--gold);
      color: #1a0508;
      padding: 12px 24px;
      border-radius: 4px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(201, 161, 58, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: inline-block;
      text-decoration: none;
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(201, 161, 58, 0.4);
    }

    .btn-outline {
      background: transparent;
      color: var(--ivory-2);
      padding: 13px 26px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.92rem;
      letter-spacing: 0.03em;
      border: 1px solid var(--line-gold);
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
      display: inline-block;
      text-decoration: none;
    }

    .btn-outline:hover {
      border-color: var(--gold);
      background: rgba(201, 161, 58, 0.08);
    }

    /* Main Section */
    main {
      flex: 1;
      padding: 40px 24px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .hero-card {
      border: 1px solid var(--line-gold);
      border-radius: 8px;
      padding: 60px 20px;
      text-align: center;
      background: var(--card-bg);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--line);
      padding-top: 44px;
      padding-bottom: 28px;
      padding-left: 32px;
      padding-right: 32px;
    }

    .foot-grid {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 24px;
      margin-bottom: 28px;
    }

    .foot-links {
      display: flex;
      gap: 26px;
      font-size: 0.88rem;
      color: rgba(247, 240, 223, 0.6);
      flex-wrap: wrap;
    }

    .foot-links a {
      color: rgba(247, 240, 223, 0.6);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .foot-links a:hover {
      color: var(--gold-light);
    }

    .foot-bottom {
      font-size: 0.78rem;
      color: rgba(247, 240, 223, 0.4);
      font-family: 'IBM Plex Mono', monospace;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo-icon">ন</div>
      <span class="logo-text">Nemblo</span>
    </div>
    <a href="#" class="btn-outline">Log in</a>
  </header>

  <main>
    <div class="hero-card">
      <div class="logo-icon" style="width: 60px; height: 60px; font-size: 1.8rem;">ন</div>
    </div>
  </main>

  <footer>
    <div class="foot-grid">
      <div class="foot-links">
        <a href="#">About Us</a>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
        <a href="#">Contact</a>
      </div>
    </div>
    <div class="foot-bottom">
      &copy; 2026 Nemblo. All rights reserved.
    </div>
  </footer>

</body>
</html>
